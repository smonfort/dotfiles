# CTRL + s is easier to type than CTRL + b
set -g prefix C-s

# Use pipe symbol to split window horizontally and hyphen to split window vertically
unbind %
bind i split-window -h -c "#{pane_current_path}" # Use the key that looks like a vertical bar
unbind '"'
bind - split-window -v -c "#{pane_current_path}" # Use the key that looks like a horizontal bar

# Use r to reload tmux config file
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded..."

# Move tmux status bar to top so that Neovim status bar stays the only one at the bottom
set-option -g status-position top

# Use vim bindings style to resize panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize pane
bind -r m resize-pane -Z

# Switch windows using Shift + arrow without prefix key, so that it looks like Mac OS desktop switching
bind -n S-Left prev
bind -n S-Right next

# Switch sessions with fzf popup instead of native tmux switch window
unbind s
bind-key s run-shell '~/.config/tmux/switch-session-fzf.sh'

# Jump to the tmux session that most recently sent a Claude Code
bind-key a run-shell '~/.config/tmux/jump-to-notified-session.sh'

# Switch to the tmux window of a running Claude Code session via fzf popup
unbind q
bind-key q run-shell '~/.config/tmux/switch-claude-window-fzf.sh'

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1
# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# Required for image display in tmux
set-option -g allow-passthrough on

# Allow mouse to resize panes
set -g mouse on

# Set the escape time to 10 milliseconds for neovim
set -sg escape-time 10
# Enable focus events for tmux for neovim
set-option -g focus-events on
# Required for neovim to work properly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Set the status bar to update every 30 seconds
set -g status-interval 30 

# Add an empty line below status bar
set -g status 2
set -g status-format[1] ''

# Use tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # navigate between vim and tmux panes

# Customize tmux theming
set -g @plugin 'jimeh/tmux-themepack' # tmux theming
set -g @powerline-color-main-1 white
set -g @powerline-color-main-2 white
set -g @powerline-color-main-3 white
set -g @powerline-color-black-1 black
set -g @powerline-color-grey-1 black
set -g @powerline-color-grey-2 black
set -g @powerline-color-grey-3 black
set -g @powerline-color-grey-4 black
set -g @powerline-color-grey-5 black
set -g @powerline-color-grey-6 black

set -g @powerline-status-left-area-left-bg black
set -g @themepack-status-left-area-left-format "-> #[fg=color141]#S #[default]"
set -g @themepack-status-left-area-middle-format ""
set -g @themepack-status-left-area-right-format ""
set -g @themepack-window-status-current-format "#[fg=color111]#[fg=black]#[bg=color111] \uebc8  #W #[default]#[fg=color111]#[fg=color141]"
set -g @themepack-window-status-format "#[fg=color60]#[italics]#W #[default]"
set -g @powerline-status-right-area-right-bg black
set -g @themepack-status-right-area-left-format "#(~/.config/tmux/tmux-battery.sh)"
set -g @themepack-status-right-area-right-format ""
set -g @themepack-status-right-area-middle-format "#[fg=color153]%a %e %b %H:%M"
set -g @themepack 'powerline/double/cyan'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
